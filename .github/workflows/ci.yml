name: CI - Verificação Pré-Produção

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

jobs:
  # 1. Validação do Frontend (Next.js & TypeScript)
  frontend-check:
    name: Next.js Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de Tipos (TypeScript)
        run: npm run typecheck

      - name: Teste de Build de Produção
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # 2. Validação do Utilitário Python (Testes Automatizados)
  python-tests:
    name: Testes Python (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pytest
        run: python -m pytest
